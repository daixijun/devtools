# Release：推送 `v*` tag 时构建 DMG 并发布 GitHub Release。
#
# 前置约定：tag 版本必须与 Cargo.toml 的 package version 一致（工作流内校验），
# 如 `v0.2.0` ⇔ `version = "0.2.0"`。产物 `DevTools-<tag>-aarch64.dmg` 及其
# SHA-256 校验和；应用未签名，Release 说明附 Gatekeeper 放行方法。
# 应用内「检查更新…」（src/utils/updater.rs）读取的就是这里的 releases/latest。

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish DMG (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 校验 tag 与 Cargo.toml 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | /usr/bin/python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag 版本 ($TAG_VERSION) 与 Cargo.toml 版本 ($CARGO_VERSION) 不一致"
            exit 1
          fi

      - name: 安装系统依赖（libheif）
        run: brew install libheif

      - uses: Swatinem/rust-cache@v2

      - name: 构建 DMG（release）
        run: scripts/build-dmg.sh

      - name: 整理发布产物（带版本号命名 + 校验和）
        run: |
          ASSET="DevTools-${GITHUB_REF_NAME}-aarch64.dmg"
          mv target/DevTools.dmg "target/$ASSET"
          shasum -a 256 "target/$ASSET" > "target/$ASSET.sha256"
          cat "target/$ASSET.sha256"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/DevTools-*-aarch64.dmg
            target/DevTools-*-aarch64.dmg.sha256
          body: |
            ## 安装说明

            下载 `DevTools-${{ github.ref_name }}-aarch64.dmg`（Apple Silicon，macOS 12+），打开后将 DevTools 拖入 Applications。

            > 应用暂未做 Developer ID 签名与公证，首次打开如被 Gatekeeper 拦截，请在终端执行
            > `xattr -cr /Applications/DevTools.app`，或在「系统设置 → 隐私与安全性」中点击「仍要打开」。
          generate_release_notes: true
