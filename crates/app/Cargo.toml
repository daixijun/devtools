[package]
name = "devtools-app"
description = "开发者工具箱 GPUI 壳（迁移目标实现）"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "devtools-gpui"
path = "src/main.rs"

[dependencies]
devtools-core.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
# syntect：代码编辑器语法高亮后端（SQL/Go/JSON 等，颜色跟随主题；升级 tree-sitter 后端时一并评估）
gpui-component = { workspace = true, features = ["syntect"] }
gpui-kit-assets = "0.10"
gpui-base.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

# 系统集成（gpui 不内置托盘）；rfd = 文件对话框（批次 II/III 工具使用）
# 全局快捷键功能已移除；共享配置中的 hotkey 字段仅为向后兼容保留
tray-icon = "0.21"
muda = "0.17"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# macOS：逐窗口显隐（gpui 公开 API 只有 App 级 hide，无窗口级 orderOut/orderFront）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"
