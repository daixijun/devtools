[package]
name = "devtools"
description = "DevTools 开发者工具箱（纯 Rust 桌面应用）"
edition = "2021"
version = "0.3.0"
license = "MIT"

# lib = 业务层（与 UI 框架无关）；bin = GPUI 壳（src/main.rs）。
# 两个 target 共享 src/ 目录但各自声明模块树：lib.rs 声明业务模块，
# main.rs 声明壳层模块；壳层经 `use devtools::...` 复用业务层。
[lib]
name = "devtools"
path = "src/lib.rs"

[[bin]]
name = "devtools"
path = "src/main.rs"

[dependencies]
# UI 壳（gpui 系）。gpui 系精确 pin，升级需单独评估 breaking change：
# gpui-pre 是 gpui 官方快照包；版本必须与 gpui-component 0.10.0 的 `=0.3.12` 锁定完全一致
gpui = { package = "gpui-pre", version = "=0.3.12" }
# syntect：代码编辑器语法高亮后端（SQL/Go/JSON 等，颜色跟随主题；升级 tree-sitter 后端时一并评估）
gpui-component = { version = "0.10", features = ["syntect"] }
gpui-kit-assets = "0.10"
# gpui-base 与 gpui-component 0.10 同源锁定（SelectableText 等文本选择基建）
gpui-base = "0.10"

# 数据与配置
serde = { version = "1", features = ["derive"] }
# preserve_order：键序保持插入序（与历史版本 JSON.stringify 行为一致，JWT 签名输入、TOML 序列化依赖此语义）
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"

# 业务逻辑依赖（异步网络/证书/图片/加解密/格式解析）
# TLS 统一 ring provider：rustls/tokio-rustls 关默认（默认 provider 是
# aws-lc-rs，Windows 构建需 NASM/Go 工具链），reqwest 的 rustls-tls 系
# feature 已强制 ring——三处一致，交叉编译零 C 依赖
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "system-proxy"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1.0"
dns-lookup = "2"
# DNS 查询原生实现：直接向指定服务器发 UDP/TCP 查询，不依赖外部 dig
# （Windows 与多数 Linux 发行版默认没有 dig）。关默认特性——不读系统
# resolv.conf、不带 TLS/DNSSEC（纯 Rust，无新增 C 依赖）
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
openssl = { version = "0.10.73", features = ["vendored"] }
x509-parser = "0.17"
base64 = "0.21"
time = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hex = "0.4"
image = { version = "0.25", features = ["default-formats"] }
oxipng = { version = "10", default-features = false, features = ["zopfli", "parallel"] }
imagequant = "4"
png = "0.18"
nom-exif = { version = "2.5", features = ["async"] }
regex = "1.10"
pcre2 = "0.2"
# RustCrypto 族：共用 digest 0.11 / cipher 0.5 基座，major 必须整体同升
# （只升个别 crate 会变成两套 Digest trait 并存，编译失败）
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
md-5 = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
aes = "0.9"   # CBC/ECB 模式基于 aes::cipher 原语手写实现，无需 cbc/ecb crate
ctr = "0.10"
cfb-mode = "0.9"
bcrypt = "0.19"
serde_yaml = "0.9"
toml = "0.8"
sqlparser = "0.58"

# 系统集成；rfd = 文件对话框（批次 II/III 工具使用）
# 全局快捷键功能已移除；共享配置中的 hotkey 字段仅为向后兼容保留
rfd = "0.15"
futures = "0.3"
sys-locale = "0.3"
raw-window-handle = "0.6"

# gpui 平台后端（gpui-pre-platform）：按平台启用窗口/渲染后端——
# macOS 用 Metal（font-kit 字体栅格化）、Linux 需 wayland/x11 至少一个、
# Windows 用 Win32+DirectWrite 无需额外 feature
[target.'cfg(target_os = "linux")'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
# 应用内自更新：解压 tar.gz 安装包（flate2 走 miniz_oxide 纯 Rust，无 C 依赖）
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12" }
# Windows：逐窗口显隐（ShowWindow/SetForegroundWindow）与开机自启（注册表 Run 键）
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
# 应用内自更新：解压 zip 安装包。关默认特性剔除 bzip2/zstd/lzma 等 C 依赖，
# 仅保留 deflate（deflate 走 flate2 rust 后端 miniz_oxide，纯 Rust）
zip = { version = "9", default-features = false, features = ["deflate"] }

# 托盘与菜单：tray-icon 的 Linux 后端（muda）依赖 GTK 事件循环，与 gpui Linux
# 自主事件循环不兼容（且 Wayland 无标准托盘协议）——托盘仅在 macOS/Windows 编译。
# 菜单用 tray_icon::menu（tray-icon 对 muda 的 re-export），勿直接声明 muda，
# 否则 cargo 报 unused dependency
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

# macOS：Metal 渲染后端（font-kit 字体栅格化）+ libheif 解码（HEIF 属 Apple
# 生态格式；其他平台无此能力，输入 HEIF 报不支持）
[target.'cfg(target_os = "macos")'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
libheif-sys = { version = "5.0.0", features = ["v1_20"] }
objc2 = "0.6"

# Windows：exe 资源嵌入（应用图标，见 build.rs 与 assets/devtools.rc）
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
opt-level = "s"
strip = "symbols"
